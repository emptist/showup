name: test

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    # showup shells out to macOS tools (pmset, ioreg, scutil, lsappinfo), so it
    # only builds and runs on macOS. The parsers are tested against output
    # captured on a real Mac, which is why this is not a Linux job.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select the latest Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.4"

      - run: swift build -c release

      # The suite is swift-testing. Its macro plugin is not loaded by this
      # SwiftPM on its own, so the Makefile passes it explicitly.
      - run: make test